<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobHuntBot · 求职工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-name">JobHuntBot</div>
    <div class="brand-sub" id="brand-sub">求职工作台</div>
  </div>
  <div class="topbar-right">
    <span class="meta" id="last-updated"></span>
    <button class="btn btn-sm" id="theme-toggle" title="切换主题">🌓</button>
    <button class="btn btn-sm" id="refresh-btn">刷新</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav id="sidebar-nav">
      <button class="nav-item active" data-view="today">今日</button>
      <button class="nav-item" data-view="jobs">岗位池</button>
      <button class="nav-item" data-view="pipeline">投递进度</button>
      <button class="nav-item" data-view="calendar">日程</button>
      <button class="nav-item" data-view="blockers">阻塞项</button>
      <button class="nav-item" data-view="settings">设置</button>
    </nav>
  </aside>

  <main class="content">
    <section id="view-today" class="view"></section>
    <section id="view-jobs" class="view hidden"></section>
    <section id="view-pipeline" class="view hidden"></section>
    <section id="view-calendar" class="view hidden"></section>
    <section id="view-blockers" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>
</div>

<!-- detail drawer -->
<div class="drawer-overlay hidden" id="drawer-overlay"></div>
<aside class="drawer" id="drawer"></aside>

<!-- toast -->
<div class="toast-wrap" id="toast-wrap"></div>

<!-- connect / error screen -->
<div id="connect-screen" class="connect-screen hidden">
  <h2 id="connect-title">正在读取数据…</h2>
  <p id="connect-desc">从同目录下的 job_pool.csv 等文件读取最新数据。</p>
  <p class="warn" id="connect-warn"></p>
</div>

<script src="app.js"></script>
</body>
</html>
